# Routes Configuration
# Định nghĩa các API public (không cần JWT) và private (cần JWT) cho từng service

services:
  # Core Service (badminton-booking-BE)
  core:
    public:
      # Public APIs - không cần JWT
      - method: GET
        path: /api/health
      - method: GET
        path: /api/auth/login
      - method: POST
        path: /api/auth/register
      - method: GET
        path: /api/auth/verify-email
      - method: POST
        path: /api/auth/forgot-password
      - method: POST
        path: /api/auth/social-login
      - method: GET
        path: /api/public/courts
      - method: GET
        path: /api/public/courts/*
      - method: GET
        path: /api/public/tournaments
      - method: GET
        path: /api/public/tournaments/*
    private:
      # Private APIs - cần JWT (mặc định tất cả routes khác)
      # Có thể để trống hoặc list cụ thể nếu muốn

  # Media Service (media-gateway) - includes realtime WebSocket
  media:
    public:
      - method: GET
        path: /api/public/images/*
      - method: GET
        path: /api/public/files/*
      - method: GET
        path: /api/health
      - method: GET
        path: /api/realtime/rooms/*/messages
    private:
      # Tất cả routes khác cần JWT
    websocket:
      # WebSocket endpoint cho realtime chat/notifications
      enabled: true
      path: /socket.io

  # Booking Service
  booking:
    public:
      - method: GET
        path: /api/public/availability
      - method: GET
        path: /api/public/prices
    private:
      # Tất cả routes khác cần JWT

  # Workflow Service (notifications, queue, scheduler)
  workflow:
    public:
      - method: GET
        path: /api/health
    private:
      # Tất cả routes khác cần JWT

  # Queue Service (deprecated - merged into workflow)
  queue:
    public:
      # Queue service thường là internal, không có public API
    private:
      # Tất cả routes cần JWT

# Global public routes (không thuộc service nào)
global:
  public:
    - path: /health
      method: GET
    - path: /metrics
      method: GET
    - path: /metrics/*
      method: GET
    - path: /registry
      method: GET
    - path: /registry/register
      method: POST
    - path: /registry/heartbeat/*
      method: POST


