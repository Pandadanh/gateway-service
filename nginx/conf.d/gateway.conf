# ============================
# MAP service -> upstream
# ============================
map $service $upstream {
  default "";

  booking       "http://host.docker.internal:8080";
  minio         "http://host.docker.internal:9000";
  minio-console "http://host.docker.internal:9001";
}

server {
  listen 80;
#   server_name dev.com;

  resolver 127.0.0.11 ipv6=off valid=30s;

  client_max_body_size 200m;

  location = /health {
    return 200 "ok\n";
  }

  location ~ ^/(?<service>[a-zA-Z0-9-]+)/(?<rest>.*)$ {
    if ($upstream = "") {
      return 404 "Unknown service\n";
    }

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass $upstream/$rest$is_args$args;
  }

  # Nếu gọi /booking (không có /)
  location ~ ^/(?<service>[a-zA-Z0-9-]+)$ {
    if ($upstream = "") {
      return 404 "Unknown service\n";
    }
    return 301 /$service/;
  }
}
